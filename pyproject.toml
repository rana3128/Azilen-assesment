[project]
name = "recon"
version = "0.1.0"
description = "Cross-system onboarding reconciliation for People systems (Ashby, Workday, Okta, Google, Slack, ExpoIT, cohort tracker)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "anthropic>=2.0",
    "mcp>=2.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
recon = "recon.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["recon*"]

[tool.setuptools.package-data]
recon = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
